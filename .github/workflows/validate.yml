name: Validate

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate catalog and module offline
        shell: pwsh
        run: ./tests/Validate-CwmApi.ps1

  validate-windows-powershell:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate module on Windows PowerShell 5.1
        shell: powershell
        run: ./tests/Validate-CwmApi.ps1
