name: Validate

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            shell: pwsh
          - os: windows-latest
            shell: powershell
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate catalog and module offline
        shell: ${{ matrix.shell }}
        run: ./tests/Validate-CwmApi.ps1
